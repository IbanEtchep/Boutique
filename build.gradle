plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'net.artisanmc'
version = '3.0.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.artisanmc.net/releases' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly('io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT')
    // Artisan — a required dependency, provided at runtime by the Artisan plugin, never shaded.
    // API 2.11.0: a module command that opens a menu (PlayerCommandDeclaration.Builder.opensMenu).
    // Until it is released on repo.artisanmc.net, publish it from Artisan's v2 branch:
    //   cd <artisan>/plugin && ./gradlew :artisan-api:publishToMavenLocal -PapiVersion=2.12.0
    compileOnly("net.artisanmc:artisan-core-api:${artisanApiVersion}")
    compileOnly('me.clip:placeholderapi:2.11.6')
    // Shaded into the jar, as with Maven before.
    implementation('com.zaxxer:HikariCP:5.0.0')

    testImplementation('io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT')
    testImplementation("net.artisanmc:artisan-core-api:${artisanApiVersion}")
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    // Tests that run core registries (Kotlin) need its stdlib; the plugin itself never does.
    testRuntimeOnly('org.jetbrains.kotlin:kotlin-stdlib:2.0.21')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events('failed')
        exceptionFormat = 'full'
    }
}

jar {
    enabled = false
}

shadowJar {
    archiveFileName = "ArtisanStore-${version}.jar"
}

tasks.named('assemble') {
    dependsOn shadowJar
}
