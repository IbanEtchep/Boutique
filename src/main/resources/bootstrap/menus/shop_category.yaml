schema: menu/v1
id: shop_category
title:
  - kind: plain
    value: { key: "boutique.shop_category.title" }
size: 54
context_inputs:
  - name: category
    type: string
  - name: category_name
    type: string
    default: ""
  - name: items
    type: list
    source: { ref: "boutique:items", filter: { category: "{category}" } }
layers:
  - id: main
    name: Main
    elements:
      - id: grid
        positions: "10-43"
        iterates: { source: items, alias: item }
        appearances:
          - material: "{item.icon}"
            title: "{item.name}"
            lore:
              - "{item.lore}"
              - "§ePrix : {item.final_price} tokens"
            click:
              left:
                steps:
                  - kind: action
                    action:
                      type: open_dialog
                      dialog_id: confirm_purchase
                      context: { item_id: "{item.id}", item_name: "{item.name}", item_price: "{item.final_price}" }
      - id: back
        positions: "49"
        appearances:
          - material: ARROW
            title: "§7Retour"
            click:
              left:
                steps:
                  - kind: action
                    action: { type: open_menu, menu_id: shop_main }
