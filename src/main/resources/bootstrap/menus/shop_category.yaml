schema: menu/v1
id: shop_category
title:
  - kind: plain
    value: { key: "boutique.shop_category.title" }
size: 54
inputs:
  - name: category
    type: string
  - name: category_name
    type: string
    default: ""
  - name: items
    type: list
    source: { ref: "boutique:items", filter: { category: "{category}" } }
elements:
  - id: grid
    positions: "10-43"
    iterates: { source: items, alias: item }
    material: "{item.icon}"
    title: "{item.name}"
    lore:
      - "{item.lore}"
      - "§ePrix : {item.final_price} tokens"
    click:
      left: 'open_dialog confirm_purchase with item_id="{item.id}" item_name="{item.name}" item_price="{item.final_price}"'
  - id: back
    positions: "49"
    material: ARROW
    title: "§7Retour"
    click:
      left: 'open_menu shop_main'
