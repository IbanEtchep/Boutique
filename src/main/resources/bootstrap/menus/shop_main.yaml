schema: menu/v1
id: shop_main
title:
  - kind: plain
    value: { key: "boutique.shop_main.title" }
size: 54
inputs:
  - name: cats
    type: list
    source: { ref: "boutique:categories" }
elements:
  - id: grid
    positions: "10-43"
    iterates: { source: cats, alias: cat }
    material: "{cat.icon}"
    title: "{cat.name}"
    click:
      left: 'open_menu shop_category with category="{cat.id}" category_name="{cat.name}"'
