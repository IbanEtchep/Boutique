schema: menu/v1
id: shop_main
title:
  - kind: plain
    value: { key: "Boutique" }
size: 54
context_inputs:
  - name: cats
    type: list
    source: { ref: "boutique:categories" }
layers:
  - id: main
    name: Main
    elements:
      - id: grid
        positions: "10-43"
        iterates: { source: cats, alias: cat }
        appearances:
          - material: "{cat.icon}"
            title: "{cat.name}"
            click:
              left:
                steps:
                  - kind: action
                    action:
                      type: open_menu
                      menu_id: shop_category
                      context: { category: "{cat.id}", category_name: "{cat.name}" }
