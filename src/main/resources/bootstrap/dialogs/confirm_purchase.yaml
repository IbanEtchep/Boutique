schema: dialog/v1
id: confirm_purchase
title: "Confirmer l'achat"
can_close_with_escape: true
body:
  - { type: text, text: "Acheter {item_name} pour {item_price} tokens ?" }
buttons:
  - id: confirm
    label: "§aConfirmer"
    actions: 'run_command "boutique:buy {item_id}" as player'
  - id: cancel
    label: "§cAnnuler"
    actions: 'open_menu shop_category'
